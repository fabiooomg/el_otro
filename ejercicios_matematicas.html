
<style>
  .tab-bar { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .tab { padding: 8px 18px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: transparent; cursor: pointer; font-size: 14px; color: var(--color-text-secondary); transition: all 0.15s; }
  .tab.active { background: var(--color-background-info); color: var(--color-text-info); border-color: transparent; font-weight: 500; }
  .section { display: none; }
  .section.active { display: block; }
  .exercise-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 12px; }
  .problem { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 12px; font-family: var(--font-mono); }
  .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 4px; }
  .fraction span { display: block; text-align: center; line-height: 1.2; }
  .fraction .num { border-bottom: 1.5px solid var(--color-text-primary); padding-bottom: 1px; }
  .answer-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .answer-input { width: 72px; height: 36px; text-align: center; font-size: 16px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); color: var(--color-text-primary); }
  .check-btn { padding: 6px 16px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); cursor: pointer; font-size: 14px; background: transparent; color: var(--color-text-primary); }
  .feedback { font-size: 14px; font-weight: 500; margin-top: 8px; min-height: 20px; }
  .correct { color: var(--color-text-success); }
  .wrong { color: var(--color-text-danger); }
  .hint { color: var(--color-text-secondary); font-size: 13px; margin-top: 6px; }
  .score-bar { display: flex; gap: 12px; margin-bottom: 1.5rem; align-items: center; }
  .score-badge { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 6px 14px; font-size: 13px; color: var(--color-text-secondary); }
  .score-badge span { font-weight: 500; font-size: 15px; color: var(--color-text-primary); }
  .new-btn { margin-top: 1rem; width: 100%; }
  .step-hint { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; font-size: 13px; color: var(--color-text-secondary); margin-top: 8px; display: none; }
  .show-steps { font-size: 13px; color: var(--color-text-info); cursor: pointer; background: none; border: none; padding: 0; margin-top: 6px; }
  .frac-answer { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .frac-answer input { width: 56px; text-align: center; font-size: 15px; }
  .sep-line { width: 56px; height: 1.5px; background: var(--color-border-primary); margin: 1px 0; }
  .label { font-size: 12px; color: var(--color-text-tertiary); }
</style>

<h2 class="sr-only">Ejercicios de matemáticas: multiplicación de fracciones y números de varios dígitos</h2>

<div class="tab-bar">
  <button class="tab active" onclick="switchTab('fracciones')">Fracciones</button>
  <button class="tab" onclick="switchTab('multiplicaciones')">Multiplicaciones</button>
</div>

<div id="fracciones" class="section active">
  <div class="score-bar">
    <div class="score-badge">Correctas: <span id="fc">0</span></div>
    <div class="score-badge">Intentos: <span id="fi">0</span></div>
  </div>
  <div id="frac-exercises"></div>
  <button class="check-btn new-btn" onclick="genFrac()">↺ Nuevos ejercicios</button>
</div>

<div id="multiplicaciones" class="section">
  <div class="score-bar">
    <div class="score-badge">Correctas: <span id="mc">0</span></div>
    <div class="score-badge">Intentos: <span id="mi">0</span></div>
  </div>
  <div id="mult-exercises"></div>
  <button class="check-btn new-btn" onclick="genMult()">↺ Nuevos ejercicios</button>
</div>

<script>
let fScore = {c:0,i:0}, mScore = {c:0,i:0};

function gcd(a,b){ return b===0?a:gcd(b,a%b); }
function simplify(n,d){ const g=gcd(Math.abs(n),Math.abs(d)); return [n/g, d/g]; }
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(t).classList.add('active');
  event.target.classList.add('active');
}

function genFracProblem(){
  const n1=rnd(1,9), d1=rnd(2,9), n2=rnd(1,9), d2=rnd(2,9);
  const rn=n1*n2, rd=d1*d2;
  const [sn,sd]=simplify(rn,rd);
  return {n1,d1,n2,d2,rn,rd,sn,sd};
}

function genFrac(){
  const container=document.getElementById('frac-exercises');
  container.innerHTML='';
  for(let i=0;i<5;i++){
    const p=genFracProblem();
    const id=`f${i}`;
    const card=document.createElement('div');
    card.className='exercise-card';
    card.innerHTML=`
      <div class="problem">
        <span class="fraction"><span class="num">${p.n1}</span><span>${p.d1}</span></span>
        &times;
        <span class="fraction"><span class="num">${p.n2}</span><span>${p.d2}</span></span>
        &nbsp;=&nbsp;
        <span class="frac-answer" style="vertical-align:middle">
          <input class="answer-input" id="${id}_n" placeholder="?" style="width:56px;margin-bottom:2px" />
          <div class="sep-line"></div>
          <input class="answer-input" id="${id}_d" placeholder="?" style="width:56px;margin-top:2px" />
        </span>
        <span style="font-size:13px;color:var(--color-text-tertiary);margin-left:4px">(simplificado)</span>
      </div>
      <div class="answer-row">
        <button class="check-btn" onclick="checkFrac('${id}',${p.sn},${p.sd},${p.rn},${p.rd})">Verificar</button>
        <button class="show-steps" onclick="toggleHint('hint_${id}')">Ver pistas</button>
      </div>
      <div class="feedback" id="fb_${id}"></div>
      <div class="step-hint" id="hint_${id}">
        <strong>Paso 1:</strong> Multiplica numeradores: ${p.n1} × ${p.n2} = ${p.rn}<br>
        <strong>Paso 2:</strong> Multiplica denominadores: ${p.d1} × ${p.d2} = ${p.rd}<br>
        <strong>Paso 3:</strong> Simplifica ${p.rn}/${p.rd} → divide ambos por ${gcd(p.rn,p.rd)}
      </div>`;
    container.appendChild(card);
  }
}

function checkFrac(id,sn,sd,rn,rd){
  const n=parseInt(document.getElementById(id+'_n').value);
  const d=parseInt(document.getElementById(id+'_d').value);
  const fb=document.getElementById('fb_'+id);
  fScore.i++;
  document.getElementById('fi').textContent=fScore.i;
  if(isNaN(n)||isNaN(d)){fb.className='feedback wrong';fb.textContent='✗ Ingresa numerador y denominador.';return;}
  const g=gcd(Math.abs(n),Math.abs(d));
  const [cn,cd]=[n/g,d/g];
  if(cn===sn&&cd===sd){
    fb.className='feedback correct';
    fb.textContent='✓ ¡Correcto! '+rn+'/'+rd+' simplificado = '+sn+'/'+sd;
    fScore.c++;
    document.getElementById('fc').textContent=fScore.c;
  } else {
    fb.className='feedback wrong';
    fb.textContent='✗ Revisa. Primero multiplica: '+rn+'/'+rd+', luego simplifica.';
  }
}

function toggleHint(id){
  const el=document.getElementById(id);
  el.style.display=el.style.display==='block'?'none':'block';
}

function genMultProblem(){
  const lvl=rnd(1,3);
  let a,b;
  if(lvl===1){a=rnd(12,99);b=rnd(12,99);}
  else if(lvl===2){a=rnd(100,999);b=rnd(12,99);}
  else{a=rnd(100,999);b=rnd(100,999);}
  return {a,b,r:a*b};
}

function genMult(){
  const container=document.getElementById('mult-exercises');
  container.innerHTML='';
  for(let i=0;i<5;i++){
    const p=genMultProblem();
    const id=`m${i}`;
    const card=document.createElement('div');
    card.className='exercise-card';
    card.innerHTML=`
      <div class="problem" style="font-size:18px">${p.a} &times; ${p.b} = ?</div>
      <div class="answer-row">
        <input class="answer-input" id="${id}_r" placeholder="Respuesta" style="width:120px" type="number" />
        <button class="check-btn" onclick="checkMult('${id}',${p.a},${p.b},${p.r})">Verificar</button>
        <button class="show-steps" onclick="toggleHint('hint_${id}')">Ver pistas</button>
      </div>
      <div class="feedback" id="fb_${id}"></div>
      <div class="step-hint" id="hint_${id}">${multHint(p.a,p.b)}</div>`;
    container.appendChild(card);
  }
}

function multHint(a,b){
  if(b<100){
    const u=b%10, t=Math.floor(b/10)%10, c=Math.floor(b/100);
    let s=`<strong>Descompon: ${b} = `;
    let parts=[];
    if(c>0) parts.push(c+'×100');
    if(t>0) parts.push(t+'×10');
    if(u>0) parts.push(u+'×1');
    s+=parts.join(' + ')+'</strong><br>';
    if(c>0) s+=`${a} × ${c*100} = ${a*c*100}<br>`;
    if(t>0) s+=`${a} × ${t*10} = ${a*t*10}<br>`;
    if(u>0) s+=`${a} × ${u} = ${a*u}<br>`;
    s+=`Suma los resultados = ${a*b}`;
    return s;
  }
  return `Usa multiplicación larga columna por columna.<br>Resultado = ${a*b}`;
}

function checkMult(id,a,b,r){
  const v=parseInt(document.getElementById(id+'_r').value);
  const fb=document.getElementById('fb_'+id);
  mScore.i++;
  document.getElementById('mi').textContent=mScore.i;
  if(isNaN(v)){fb.className='feedback wrong';fb.textContent='✗ Ingresa un número.';return;}
  if(v===r){
    fb.className='feedback correct';
    fb.textContent='✓ ¡Correcto! '+a+' × '+b+' = '+r;
    mScore.c++;
    document.getElementById('mc').textContent=mScore.c;
  } else {
    fb.className='feedback wrong';
    fb.textContent='✗ No es correcto. Intenta de nuevo o mira las pistas.';
  }
}

genFrac();
genMult();
</script>
